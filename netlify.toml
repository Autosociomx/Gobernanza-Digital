[build]
  # La Guardia corre antes del build: si detecta una regresión (llave en el
  # bundle, metadatos genéricos, archivos borrados), el deploy falla y el PR
  # queda marcado en rojo — protección independiente de GitHub Actions.
  command = "node scripts/verificar-regresiones.mjs && npm run build"
  publish = "dist"

# U-22 (Sesión 23): la ruta compartible por folio /orbe/reporte/<folio>
# debe servir la app ORBE, no la raíz. Sin esta regla, el fallback SPA
# de abajo la mandaría a /index.html (el landing Vite) y la ruta no
# abriría el reporte. Netlify aplica las reglas en orden: esta, más
# específica, va primero.
[[redirects]]
  from = "/orbe/reporte/*"
  to = "/orbe/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets con hash en el nombre: cachear un año (inmutables entre deploys)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
    # CSP enforcing (Sesión 23, contrato §15). DEUDA DOCUMENTADA: el
    # 'unsafe-inline' en script-src y style-src existe porque la app es un
    # solo HTML con 23 onclick= y 61 style="..." en línea y 3 <script> en
    # línea. Una CSP estricta sin él exige convertir todo eso (refactor
    # grande, follow-up definido, no en esta ronda). Aun así, un script
    # externo inyectado NO se ejecuta ('self'). connect-src incluye
    # nominatim.openstreetmap.org porque el reverse-geocode de la app lo
    # usa (verificado en public/orbe/index.html); img-src https: cubre
    # los tiles de OpenStreetMap y Esri.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://nominatim.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# PC-4: microphone=(self) SOLO para /orbe/* — el microphone=() global de
# arriba rompía la voz de marIA. Este bloque, más específico, prevalece
# para /orbe/* (Netlify: la cabecera del path más específico gana).
[[headers]]
  for = "/orbe/*"
  [headers.values]
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(self)"

[functions]
  node_bundler = "esbuild"

