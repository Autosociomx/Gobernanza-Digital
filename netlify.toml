[build]
  # La Guardia corre antes del build: si detecta una regresión (llave en el
  # bundle, metadatos genéricos, archivos borrados), el deploy falla y el PR
  # queda marcado en rojo — protección independiente de GitHub Actions.
  # ORBE P0 añade un gate E2E reproducible: si cualquiera de los ocho casos
  # falla, Netlify no publica el deploy.
  # preparar-config-firebase.mjs materializa firebase-applet-config.json, que
  # está gitignoreado y que src/firebase.ts importa: sin él `npm run build` no
  # resuelve el módulo. Requiere la variable FIREBASE_APPLET_CONFIG con el JSON
  # completo en la configuración del sitio; si falta, el build falla diciéndolo
  # en vez de con un «Could not resolve» opaco. Ver CI-01 en docs/marco/ESTADO.md.
  command = "node scripts/verificar-regresiones.mjs && node scripts/preparar-config-firebase.mjs && npm run test:orbe-p0-e2e && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets con hash en el nombre: cachear un año (inmutables entre deploys)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
