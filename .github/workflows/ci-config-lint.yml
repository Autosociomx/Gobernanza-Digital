name: Validación de workflows

"on":
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - 'codex/**'
      - 'agent/**'
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -version
      - name: Validar GitHub Actions
        run: ./actionlint .github/workflows/
