name: Guardia de regresiones

# Protege el repositorio de las regresiones que los pushes desde AI Studio
# ya introdujeron cuatro veces: llave de API en el bundle del navegador,
# metadatos genéricos, pérdida de code-splitting y borrado de archivos de
# despliegue. Referencia: docs/marco/PROTOCOLO_SEGURIDAD.md

"on":
  push:
    branches:
      - main
      - 'agent/**'
      - 'codex/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardia-regresiones-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar regresiones (config y archivos)
        run: node scripts/verificar-regresiones.mjs

      - name: Verificar tipos
        run: npm run lint

      - name: Probar integración ORBE–Context.OS
        run: npm run test:orbe-contextos

      - name: Probar P1 Identity Gateway + Institutional Graph
        run: npm run test:p1

      - name: Probar vertical slice ORBE P0 extremo a extremo
        run: npm run test:orbe-p0-e2e

      - name: Conservar reporte ORBE P0 E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbe-p0-e2e-report
          path: artifacts/orbe-p0-e2e-report.md
          if-no-files-found: warn

      - name: Compilar y verificar que la llave no esté en el bundle
        run: |
          npx vite build
          if grep -rl "GEMINI" dist/assets/; then
            echo "::error::La cadena GEMINI aparece en el bundle del navegador — la llave estaría expuesta."
            exit 1
          fi
          echo "Bundle limpio: la llave no viaja al cliente."
