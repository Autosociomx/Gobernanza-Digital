name: Diagnóstico de actualización de dependencias

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-remediation-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediation-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Normalizar lockfile contra package.json
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit
      - name: Aplicar actualizaciones compatibles al lockfile
        run: npm audit fix --package-lock-only
      - name: Verificar auditoría tras la actualización propuesta
        run: npm audit --omit=dev --audit-level=high
      - name: Commit de lockfile validado a la rama de la PR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "El lockfile no cambió; no hay commit que crear."
            exit 0
          fi
          git commit -m "security: actualizar lockfile y corregir grpc-js vulnerable"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Publicar lockfile candidato para revisión
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-lockfile-candidate
          path: package-lock.json
          retention-days: 7
