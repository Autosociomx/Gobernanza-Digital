name: Diagnóstico de actualización de dependencias

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-remediation-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediation-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Normalizar lockfile contra package.json
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit
      - name: Aplicar actualizaciones compatibles al lockfile
        run: npm audit fix --package-lock-only
      - name: Verificar auditoría tras la actualización propuesta
        run: npm audit --omit=dev --audit-level=high
      - name: Publicar lockfile candidato para revisión
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-lockfile-candidate
          path: package-lock.json
          retention-days: 7
