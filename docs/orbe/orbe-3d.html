<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Orbe en 3D — Nayarit Digital</title>
<style>
  /* Sin CDNs externos a propósito: este archivo debe abrir y funcionar
     siempre, aunque no haya red (a diferencia de cop.html, que sí
     depende de Tailwind/Font Awesome/Google Fonts). */
  :root {
    --bg0: #0b1120;
    --bg1: #14213D;
    --ink: #F8F6F1;
    --mut: #a0aec0;
    --dim: #5A6478;
    --line: rgba(248,246,241,.08);
    --panel: rgba(10,15,26,.92);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 10%, var(--bg1) 0%, var(--bg0) 60%, #05070d 100%);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
    overflow: hidden;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 28px;
    pointer-events: none;
  }
  header * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 999px;
    background: linear-gradient(135deg, #D81E5B, #0FA3B1);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: white; font-size: 18px;
    box-shadow: 0 0 24px rgba(216,30,91,.4);
  }
  .brand h1 { font-size: 15px; font-weight: 800; margin: 0; }
  .brand p { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--mut); margin: 2px 0 0; }

  .cfg-toggle {
    background: var(--panel); border: 1px solid var(--line); color: var(--mut);
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    backdrop-filter: blur(10px);
  }
  .cfg-toggle:hover { color: var(--ink); border-color: rgba(248,246,241,.2); }

  #cfg-box {
    position: fixed; top: 68px; right: 28px; z-index: 30;
    width: 300px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; backdrop-filter: blur(10px);
    display: none;
  }
  #cfg-box.open { display: block; }
  #cfg-box label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); display: block; margin-bottom: 6px; }
  #cfg-box input {
    width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line);
    color: var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  }
  #cfg-box p { font-size: 10px; color: var(--dim); line-height: 1.5; margin: 8px 0 0; }

  /* --- Escenario del Orbe --- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 1400px;
  }
  #orbe-center {
    position: relative; width: 1px; height: 1px;
  }
  .nodo {
    position: absolute;
    left: 0; top: 0;
    transform-style: preserve-3d;
    cursor: pointer;
    will-change: transform;
  }
  .nodo-giro {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    animation: girar linear infinite;
    animation-duration: var(--spin, 12s);
  }
  @keyframes girar {
    0%   { transform: rotateZ(45deg) rotateY(0deg) rotateX(8deg); }
    100% { transform: rotateZ(45deg) rotateY(360deg) rotateX(8deg); }
  }
  .capa {
    position: absolute;
    border-style: solid;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.3),
      inset 0 -2px 3px rgba(0,0,0,.3),
      0 1px 2px rgba(0,0,0,.25);
  }
  .nodo-label {
    position: absolute;
    top: calc(100% + 10px); left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 12px; font-weight: 700;
    color: var(--ink);
    text-shadow: 0 2px 6px rgba(0,0,0,.9);
    pointer-events: none;
    opacity: .85;
  }
  .nodo-estado {
    position: absolute;
    top: calc(100% + 28px); left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px;
    pointer-events: none;
  }
  .nodo.sin-codigo { filter: grayscale(0.55) opacity(0.75); }
  .nodo.activo .nodo-label { opacity: 1; }
  .nodo:hover .nodo-label { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .nodo-giro { animation: none; }
  }

  /* --- Panel de información al seleccionar un nodo --- */
  #info-panel {
    position: fixed; left: 50%; bottom: 24px; z-index: 40;
    transform: translateX(-50%) translateY(140%);
    transition: transform .4s cubic-bezier(.16,1,.3,1);
    width: min(560px, calc(100vw - 40px));
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 20px 22px;
    backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  #info-panel.open { transform: translateX(-50%) translateY(0); }
  #info-panel .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #info-panel h2 { font-size: 17px; margin: 0 0 4px; }
  #info-panel .estado-badge {
    font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  #info-panel p.desc { font-size: 13px; color: var(--mut); line-height: 1.6; margin: 10px 0 14px; }
  #info-panel .acciones { display: flex; flex-wrap: wrap; gap: 10px; }
  #info-panel a.btn, #info-panel button.btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .02em;
    padding: 10px 16px; border-radius: 10px; text-decoration: none;
    border: 1px solid transparent; cursor: pointer;
  }
  #info-panel .btn-primary { background: #D81E5B; color: white; }
  #info-panel .btn-secondary { background: rgba(248,246,241,.08); color: var(--ink); border-color: var(--line); }
  #info-panel .aviso {
    font-size: 12px; color: #ffc96a; background: rgba(245,166,35,.12);
    border: 1px solid rgba(245,166,35,.3); padding: 10px 12px; border-radius: 10px;
    line-height: 1.5;
  }
  #info-panel .close {
    background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px;
  }
  #info-panel .close:hover { color: var(--ink); }

  #hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase;
    z-index: 20; pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">N</div>
    <div>
      <h1>El Orbe · Nayarit Digital</h1>
      <p>9 módulos reales + 2 marcados · grafo vivo</p>
    </div>
  </div>
  <button class="cfg-toggle" onclick="toggleCfg()">⚙ Configurar destino</button>
</header>

<div id="cfg-box">
  <label for="base-url">URL base de la app</label>
  <input id="base-url" type="text" placeholder="https://tepic.netlify.app">
  <p>Los botones "Ir a…" arman la URL con <code>?view=…&amp;modulo=…</code> sobre esta base.
     Por defecto usa el sitio en producción; cámbiala si estás probando contra
     <code>localhost:3000</code>.</p>
</div>

<div id="stage">
  <div id="orbe-center"></div>
</div>

<p id="hint">Toca un círculo del Orbe</p>

<div id="info-panel">
  <div class="row">
    <div>
      <h2 id="ip-title">—</h2>
      <span id="ip-estado" class="estado-badge">—</span>
    </div>
    <button class="close" onclick="closePanel()">✕</button>
  </div>
  <p class="desc" id="ip-desc"></p>
  <div id="ip-body"></div>
</div>

<script>
// =========================================================================
// GRAFO DEL ORBE — misma fuente de verdad que docs/orbe/modulos.json y
// docs/marco/modulos/INDICE.json. Si un módulo cambia de estado o de
// superficie ahí, actualiza esta lista también.
// =========================================================================
const ESTADO_LABEL = {
  disenado: 'Diseñado', propuesta: 'Propuesta', en_construccion: 'En construcción',
  piloto: 'Piloto', desplegado: 'Desplegado', maqueta: 'Maqueta', sin_codigo: 'Sin código',
};
const ESTADO_COLOR = {
  disenado: '#64748b', propuesta: '#eab308', en_construccion: '#f97316',
  piloto: '#3b82f6', desplegado: '#10b981', maqueta: '#a855f7', sin_codigo: '#64748b',
};

// destino: función que arma la URL real dentro de la app, o null si no
// existe pantalla propia todavía (nunca se inventa un link falso).
const ORBE = [
  {
    id: 'orbe-nucleo', nombre: 'Orbe Central (Aura)', esCentro: true,
    desc: 'Núcleo agéntico: voz + conciencia de página. Orquesta la conversación y enruta al módulo correcto — no almacena datos.',
    estado: 'en_construccion',
    palette: ['#D81E5B', '#F5A623', '#0FA3B1', '#4C9F70', '#8b5cf6', '#14213D'],
    size: 128,
    destinos: [{ label: 'Ver Asistente IA en C5', view: 'c5', modulo: 'ia' }],
  },
  {
    id: 'llave-identidad', nombre: 'Llave e Identidad',
    desc: 'Identidad ciudadana: Llave MX (adultos) y Llave Infantil (menores, con consentimiento del tutor).',
    estado: 'propuesta', sinCodigo: true,
    palette: ['#64748b', '#94a3b8', '#cbd5e1', '#475569'],
    size: 84,
    destinos: [],
    motivo: 'Es una propuesta de identidad federada — todavía no tiene pantalla propia en el código. Hoy el "login" real de la app es Google (LoginView.tsx).',
  },
  {
    id: 'expediente-familiar', nombre: 'Expediente Digital Familiar',
    desc: 'Expediente único por CURP para padres y niños. En el código de hoy vive junto con TEPICTU Salud, dentro de C5 → Salud Inteligente (SaludNayaritID.tsx).',
    estado: 'piloto',
    palette: ['#00ff9d', '#0FA3B1', '#4C9F70', '#F8F6F1'],
    size: 88,
    destinos: [{ label: 'Ir a Salud Inteligente (C5)', view: 'c5', modulo: 'salud' }],
  },
  {
    id: 'tepictu-salud', nombre: 'TEPICTU Salud',
    desc: 'Triaje médico con IA que funciona sin conexión a internet. Comparte pantalla real con Expediente Digital Familiar en C5 → Salud Inteligente.',
    estado: 'disenado',
    palette: ['#f43f5e', '#0FA3B1', '#F8F6F1', '#8b5cf6'],
    size: 84,
    destinos: [{ label: 'Ir a Salud Inteligente (C5)', view: 'c5', modulo: 'salud' }],
  },
  {
    id: 'tesoreria', nombre: 'Tesorería Digital',
    desc: 'Pagos y cobros municipales. Existe una vista de gestión en C5 y una de trámite en el portal ciudadano — con distinto grado de avance.',
    estado: 'maqueta',
    palette: ['#F5A623', '#D81E5B', '#14213D', '#F8F6F1'],
    size: 88,
    destinos: [
      { label: 'Ir a Tesorería (C5, maqueta)', view: 'c5', modulo: 'tesoreria' },
      { label: 'Ir a Pagos (portal ciudadano)', view: 'citizen', tab: 'payments', aviso: 'Marcado como "riesgo" en la auditoría interna (docs/marco/modulos/payments.md) — revísalo antes de mostrarlo como listo.' },
    ],
  },
  {
    id: 'obras', nombre: 'Trazabilidad de Obras',
    desc: 'Seguimiento público de obra pública, con trazabilidad de fondos (incluye el FAISPIAM).',
    estado: 'maqueta',
    palette: ['#E85D04', '#F5A623', '#14213D'],
    size: 84,
    destinos: [{ label: 'Ir a Trazabilidad de Obras (C5)', view: 'c5', modulo: 'obras' }],
  },
  {
    id: 'servicios-publicos', nombre: 'Servicios Públicos Inteligente',
    desc: 'Reportes ciudadanos (baches, luz, agua) geolocalizados.',
    estado: 'maqueta',
    palette: ['#8b5cf6', '#0FA3B1', '#F8F6F1'],
    size: 84,
    destinos: [
      { label: 'Ir a Servicios Públicos (C5, maqueta)', view: 'c5', modulo: 'servicios' },
      { label: 'Ir a Servicios y Reportes (ciudadano)', view: 'citizen', tab: 'services' },
    ],
  },
  {
    id: 'bienestar', nombre: 'Bienestar Social',
    desc: 'Programas sociales y derivación de casos vulnerables desde Salud y desde Llave e Identidad.',
    estado: 'maqueta',
    palette: ['#4C9F70', '#0FA3B1', '#F8F6F1'],
    size: 84,
    destinos: [{ label: 'Ir a Bienestar Social (C5)', view: 'c5', modulo: 'bienestar' }],
  },
  {
    id: 'pulso-nayarit', nombre: 'Pulso Nayarit',
    desc: 'Auditoría cívica con ledger criptográfico (Supabase/Postgres). El backend más maduro del ecosistema — deliberadamente aislado del resto, sin compartir identidad con los demás módulos.',
    estado: 'desplegado',
    palette: ['#14b8a6', '#3b82f6', '#F8F6F1'],
    size: 86,
    destinos: [],
    motivo: 'No tiene URL pública registrada en este repo (corre desde pulso-nayarit/frontend/, backend Supabase separado). Puedes revisar el código real:',
    codigoUrl: 'https://github.com/Autosociomx/Gobernanza-digital-/tree/main/pulso-nayarit',
  },
  {
    id: 'proteccion-digital', nombre: 'Protección Digital',
    desc: 'Canal de denuncia digital disponible 24/7, con el anonimato del denunciante como restricción más alta.',
    estado: 'propuesta', sinCodigo: true,
    palette: ['#64748b', '#94a3b8', '#cbd5e1', '#475569'],
    size: 80,
    destinos: [],
    motivo: 'Es una propuesta legislativa — todavía sin código (docs/plataforma/01-VISION-PRODUCTO.md lo marca explícitamente así).',
  },
  {
    id: 'agrovision', nombre: 'Agrovisión 3D',
    desc: 'Monitoreo satelital y modelado de producción agropecuaria. El panel existe en C5 — pero "Octane 3D Engine" es texto decorativo, no un motor 3D real (docs/marco/modulos/agrovision.md).',
    estado: 'maqueta',
    palette: ['#4C9F70', '#F5A623', '#14213D'],
    size: 84,
    destinos: [{ label: 'Ir a Agrovisión 3D (C5, maqueta)', view: 'c5', modulo: 'agrovision' }],
  },
  {
    id: 'ruta-pro', nombre: 'Ruta PRO',
    desc: 'Transporte público / ruteo — apareció como tarjeta de ejemplo en una versión antigua de la landing y se quitó a propósito en el commit 72bf762 por ser un placeholder sin funcionalidad real detrás.',
    estado: 'sin_codigo', sinCodigo: true,
    palette: ['#64748b', '#94a3b8', '#cbd5e1'],
    size: 78,
    destinos: [],
    motivo: 'Hoy no existe en el código del repo. Si lo quieres de verdad, es un módulo nuevo por construir — dilo y lo armamos con su propia pantalla, no solo con un nodo en el grafo.',
  },
];

// =========================================================================
// CONSTRUCCIÓN DEL OJO DE DIOS 3D (perspective + translateZ real, sin WebGL)
// =========================================================================
function buildOjo(size, palette) {
  const wrap = document.createElement('div');
  wrap.className = 'nodo-giro';
  const nLayers = Math.min(palette.length, 6);
  for (let i = 0; i < nLayers; i++) {
    const capa = document.createElement('div');
    capa.className = 'capa';
    const borderWidth = Math.max(4, Math.round(size * 0.12) - i);
    const inset = i === 0 ? 0 : palette.slice(0, i).reduce((acc, _, j) => acc + Math.max(4, Math.round(size * 0.12) - j), 0);
    capa.style.inset = inset + 'px';
    if (i === nLayers - 1) {
      capa.style.background = palette[i];
    } else {
      capa.style.borderWidth = borderWidth + 'px';
      capa.style.borderColor = palette[i];
    }
    capa.style.transform = `translateZ(${i * 2.5}px)`;
    wrap.appendChild(capa);
  }
  return wrap;
}

// =========================================================================
// LAYOUT: núcleo al centro, el resto en círculo (como el mermaid de README.md)
// =========================================================================
const center = document.getElementById('orbe-center');
const nucleo = ORBE.find(n => n.esCentro);
const outer = ORBE.filter(n => !n.esCentro);
const radius = Math.min(window.innerWidth, window.innerHeight) * 0.34;

function placeNode(node, x, y) {
  const el = document.createElement('div');
  el.className = 'nodo' + (node.sinCodigo ? ' sin-codigo' : '');
  el.style.width = node.size + 'px';
  el.style.height = node.size + 'px';
  el.style.setProperty('--spin', (9 + Math.random() * 6).toFixed(1) + 's');
  el.dataset.x = x;
  el.dataset.y = y;

  const ojo = buildOjo(node.size, node.palette);
  el.appendChild(ojo);

  const label = document.createElement('div');
  label.className = 'nodo-label';
  label.textContent = node.nombre;
  el.appendChild(label);

  const estado = document.createElement('div');
  estado.className = 'nodo-estado';
  estado.textContent = ESTADO_LABEL[node.estado] || node.estado;
  estado.style.color = ESTADO_COLOR[node.estado];
  estado.style.background = ESTADO_COLOR[node.estado] + '22';
  estado.style.border = `1px solid ${ESTADO_COLOR[node.estado]}55`;
  el.appendChild(estado);

  el.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node, el); });

  center.appendChild(el);
  return el;
}

const nucleoEl = placeNode(nucleo, 0, 0);
nucleoEl.style.transform = 'translate(-50%, -50%)';

const angleStep = (2 * Math.PI) / outer.length;
outer.forEach((node, i) => {
  const angle = i * angleStep - Math.PI / 2;
  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;
  const el = placeNode(node, x, y);
  el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
});

// --- Paralaje suave con el mouse sobre todo el grupo ---
let tx = 0, ty = 0, cx = 0, cy = 0;
window.addEventListener('mousemove', (e) => {
  tx = (e.clientX / window.innerWidth - 0.5);
  ty = (e.clientY / window.innerHeight - 0.5);
});
(function loop() {
  cx += (tx - cx) * 0.05;
  cy += (ty - cy) * 0.05;
  document.querySelectorAll('.nodo').forEach(el => {
    const x = parseFloat(el.dataset.x), y = parseFloat(el.dataset.y);
    const px = x + cx * 26;
    const py = y + cy * 26;
    el.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
  });
  requestAnimationFrame(loop);
})();

// =========================================================================
// PANEL DE INFO + NAVEGACIÓN REAL
// =========================================================================
const KEY_BASE_URL = 'orbe3d_base_url';
const baseUrlInput = document.getElementById('base-url');
baseUrlInput.value = localStorage.getItem(KEY_BASE_URL) || 'https://tepic.netlify.app';
baseUrlInput.addEventListener('input', () => localStorage.setItem(KEY_BASE_URL, baseUrlInput.value.trim()));

function toggleCfg() { document.getElementById('cfg-box').classList.toggle('open'); }

function buildUrl(destino) {
  const base = (localStorage.getItem(KEY_BASE_URL) || baseUrlInput.value || 'https://tepic.netlify.app').replace(/\/$/, '');
  const params = new URLSearchParams();
  params.set('view', destino.view);
  if (destino.modulo) params.set('modulo', destino.modulo);
  if (destino.tab) params.set('tab', destino.tab);
  return `${base}/?${params.toString()}`;
}

let activeEl = null;
function selectNode(node, el) {
  document.querySelectorAll('.nodo').forEach(n => n.classList.remove('activo'));
  el.classList.add('activo');
  activeEl = el;
  document.getElementById('hint').style.display = 'none';

  document.getElementById('ip-title').textContent = node.nombre;
  const badge = document.getElementById('ip-estado');
  badge.textContent = ESTADO_LABEL[node.estado] || node.estado;
  badge.style.color = ESTADO_COLOR[node.estado];
  badge.style.background = ESTADO_COLOR[node.estado] + '22';
  badge.style.border = `1px solid ${ESTADO_COLOR[node.estado]}55`;
  document.getElementById('ip-desc').textContent = node.desc;

  const body = document.getElementById('ip-body');
  body.innerHTML = '';

  if (node.destinos && node.destinos.length) {
    const acciones = document.createElement('div');
    acciones.className = 'acciones';
    node.destinos.forEach((d, i) => {
      if (d.aviso) {
        const aviso = document.createElement('div');
        aviso.className = 'aviso';
        aviso.style.width = '100%';
        aviso.textContent = '⚠ ' + d.aviso;
        acciones.appendChild(aviso);
      }
      const a = document.createElement('a');
      a.className = 'btn ' + (i === 0 ? 'btn-primary' : 'btn-secondary');
      a.href = buildUrl(d);
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = d.label + ' →';
      acciones.appendChild(a);
    });
    body.appendChild(acciones);
  }

  if (node.motivo) {
    const aviso = document.createElement('div');
    aviso.className = 'aviso';
    aviso.style.marginTop = node.destinos && node.destinos.length ? '10px' : '0';
    aviso.textContent = node.motivo;
    body.appendChild(aviso);

    if (node.codigoUrl) {
      const acciones = document.createElement('div');
      acciones.className = 'acciones';
      acciones.style.marginTop = '10px';
      const a = document.createElement('a');
      a.className = 'btn btn-secondary';
      a.href = node.codigoUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'Ver código fuente →';
      acciones.appendChild(a);
      body.appendChild(acciones);
    }
  }

  document.getElementById('info-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
  document.getElementById('hint').style.display = 'block';
  if (activeEl) activeEl.classList.remove('activo');
}

window.addEventListener('resize', () => location.reload());
</script>
</body>
</html>
