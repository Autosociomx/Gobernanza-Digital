  purpose: >-
    Extends the frozen v0.1 definition with the dimension it left implicit: the
    order of government. Declares that ORBE serves a person, not a tier, and that
    jurisdiction is a datum of the procedure resolved by the canon
    (data/canon/), never a system-wide assumption.
  changes_vs_parent:
    - Adds the jurisdictional canon as delivered data and code (data/canon/,
      shared/canon/, scripts/verificar-canon.mjs) covering federal, state and
      municipal procedures for guidance.
    - Specifies, without executing, the contextos.v0.2 envelope change that would
      allow execution beyond the municipal tier, with its acceptance tests.
    - Records adjacent debt: service-scoped POLICY_VERSION, public-works-bound
      envelope builder, duplicated citizen-text normalizer.
  not_changed:
    - The ten constitutional invariants of v0.1/ORBE_CANON.md section 6.
    - Execution mode remains LAB_MOCK. Widening jurisdiction does not widen authority.
